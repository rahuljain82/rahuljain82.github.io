<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Booking - Running Ninjas</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9WH7YSXZ94"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9WH7YSXZ94');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-10">
  <div class="w-full flex justify-center mb-6">
    <img src="https://i.ibb.co/ZRLT8bH9/Whats-App-Image-2025-07-16-at-17-29-51.jpg" alt="Running Ninjas Logo" class="w-16 h-16 rounded-full" />
  </div>

  <div class="max-w-md mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Ninja Discount &amp; Bus Interest</h2>

    <form id="busBookingForm">
      <label class="block mb-3">Select Marathon
        <select id="marathonName" required class="w-full mt-1 p-2 border rounded">
          <option value="">Loading events...</option>
        </select>
      </label>

      <label class="block mb-2">
        <span class="flex items-center gap-1">Enter Unique ID
          <button type="button" onclick="document.getElementById('uniqueIdInfo').classList.toggle('hidden')" class="w-4 h-4 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold leading-none flex items-center justify-center hover:bg-indigo-200" title="What is my Unique ID?">i</button>
        </span>
        <div id="uniqueIdInfo" class="hidden mt-1 mb-2 text-xs text-gray-600 bg-indigo-50 border border-indigo-100 rounded p-2 leading-relaxed">
          Your Unique ID is the first 4 letters of your first name in capitals, followed by your flat number.<br/>
          <span class="font-medium">Example:</span> John Doe living in flat B204 → <span class="font-mono font-semibold text-indigo-700">JOHNB204</span>
        </div>
        <input id="uniqueId" type="text" required class="w-full mt-1 p-2 border rounded" />
      </label>

      <button type="button" onclick="showForm()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded mb-4">Show Booking Form</button>

      <div id="runnerDetails" class="hidden">
        <label class="block mb-2">Your Name
          <input id="name" type="text" required class="w-full mt-1 p-2 border rounded" />
        </label>
        <label class="block mb-2">Your Flat Number
          <input id="flat" type="text" required class="w-full mt-1 p-2 border rounded" />
        </label>
        <label class="block mb-2">Race Category
          <select id="raceCategory" required class="w-full mt-1 p-2 border rounded">
            <option value="">-- Select Race Category --</option>
          </select>
        </label>
        <label class="block mb-2 mt-4">Number of Bus Seats Required
          <input id="busSeats" type="number" min="1" max="10" required class="w-full mt-1 p-2 border rounded" placeholder="Enter number of seats" />
        </label>

        <div id="existingBusNotice" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded p-3 mb-3">
          ⚠️ An existing bus registration for this race was found and pre-filled above.
        </div>

        <p id="submitError" class="hidden text-red-600 text-sm mb-2"></p>
        <button id="busSubmitBtn" type="submit" class="w-full bg-green-600 text-white font-semibold py-2 rounded mt-2">Count me In</button>
      </div>
    </form>

    <p id="formMessage" class="text-green-600 mt-4 hidden">Entry successful!</p>
  </div>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async function() {
      const { data, error } = await db
        .from('events')
        .select('event_name')
        .eq('bus_available', true)
        .order('event_date', { ascending: true });

      const dropdown = document.getElementById('marathonName');
      dropdown.innerHTML = '';

      if (error || !data || data.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No bus events available';
        dropdown.appendChild(opt);
        return;
      }

      data.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.event_name;
        opt.textContent = e.event_name;
        dropdown.appendChild(opt);
      });

      const params = new URLSearchParams(window.location.search);
      const preUniqueId = params.get('uniqueId');
      const preEvent = params.get('event');
      if (preUniqueId && preEvent) {
        document.getElementById('uniqueId').value = preUniqueId;
        dropdown.value = preEvent;
        await showForm();
      }
    };

    const RACE_CAT_LABELS = { '5K':'5K', '10K':'10K', '21K':'21K (Half Marathon)', '42K':'42K (Full Marathon)', '50K':'50K (Ultra)', '70K':'70K (Ultra)', '100K':'100K (Ultra)' };

    async function showForm() {
      const uniqueId = document.getElementById('uniqueId').value.trim();
      const marathonName = document.getElementById('marathonName').value;
      if (!uniqueId || !marathonName) return alert('Please fill both fields.');

      const { data: runner } = await db
        .from('runners')
        .select('first_name, last_name, flat_number')
        .eq('unique_id', uniqueId)
        .single();

      if (!runner) { alert('Runner not found. Please check your Unique ID.'); return; }

      document.getElementById('name').value = runner.first_name + ' ' + (runner.last_name || '');
      document.getElementById('flat').value = runner.flat_number;

      document.getElementById('uniqueId').setAttribute('readonly', true);
      document.getElementById('uniqueId').classList.add('bg-gray-100', 'text-gray-500');
      document.getElementById('marathonName').setAttribute('disabled', true);

      const { data: eventData, error: catError } = await db
        .from('event_race_categories')
        .select('race_categories')
        .eq('event_name', marathonName)
        .maybeSingle();
      if (catError) console.error('event_race_categories error:', catError.message);
      const cats = eventData?.race_categories || [];
      const catSel = document.getElementById('raceCategory');
      catSel.innerHTML = '<option value="">-- Select Race Category --</option>';
      cats.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = RACE_CAT_LABELS[c] || c; catSel.appendChild(opt); });

      const { data: existingBus } = await db
        .from('bus_bookings')
        .select('race_category, bus_seats')
        .eq('unique_id', uniqueId)
        .eq('event_name', marathonName)
        .maybeSingle();

      const notice = document.getElementById('existingBusNotice');
      if (existingBus) {
        document.getElementById('raceCategory').value = existingBus.race_category || '';
        document.getElementById('busSeats').value = existingBus.bus_seats || '';
        notice.classList.remove('hidden');
        document.getElementById('busSubmitBtn').textContent = 'Update Bus Registration';
      } else {
        notice.classList.add('hidden');
        document.getElementById('busSubmitBtn').textContent = 'Count me In';
      }

      document.getElementById('runnerDetails').classList.remove('hidden');
    }

    document.getElementById('busBookingForm').addEventListener('submit', async e => {
      e.preventDefault();

      const uniqueId    = document.getElementById('uniqueId').value.trim();
      const eventName   = document.getElementById('marathonName').value;
      const raceCategory = document.getElementById('raceCategory').value;
      const busSeats    = document.getElementById('busSeats').value;
      const errEl       = document.getElementById('submitError');

      if (!uniqueId || !eventName) {
        errEl.textContent = 'Missing event or Unique ID. Please refresh and start again.';
        errEl.classList.remove('hidden'); return;
      }
      if (!raceCategory) {
        errEl.textContent = 'Please select a race category.';
        errEl.classList.remove('hidden'); return;
      }
      if (!busSeats || parseInt(busSeats) < 1) {
        errEl.textContent = 'Please enter the number of bus seats required.';
        errEl.classList.remove('hidden'); return;
      }
      errEl.classList.add('hidden');

      const { error } = await db.from('bus_bookings').upsert([{
        unique_id:     document.getElementById('uniqueId').value.trim(),
        event_name:    document.getElementById('marathonName').value,
        name:          document.getElementById('name').value,
        flat:          document.getElementById('flat').value,
        race_category: document.getElementById('raceCategory').value,
        bus_seats:     parseInt(document.getElementById('busSeats').value),
      }], { onConflict: 'unique_id,event_name' });

      if (error) {
        document.getElementById('submitError').textContent = 'Something went wrong. Please check your details and try again.';
        document.getElementById('submitError').classList.remove('hidden');
        return;
      }

      document.getElementById('formMessage').classList.remove('hidden');
      document.getElementById('busBookingForm').reset();
      document.getElementById('runnerDetails').classList.add('hidden');
      document.getElementById('busSubmitBtn').textContent = 'Count me In';
      document.getElementById('submitError').classList.add('hidden');
      document.getElementById('uniqueId').removeAttribute('readonly');
      document.getElementById('uniqueId').classList.remove('bg-gray-100', 'text-gray-500');
      document.getElementById('marathonName').removeAttribute('disabled');
    });
  </script>
</body>
</html>
