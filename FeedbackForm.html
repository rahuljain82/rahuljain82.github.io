<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Race Feedback - Running Ninjas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::placeholder {
      color: #9ca3af; /* Tailwind gray-400 */
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="bg-gray-50 py-10">
  <!-- Logo -->
  <div class="w-full flex justify-center mb-6">
    <img src="https://i.ibb.co/ZRLT8bH9/Whats-App-Image-2025-07-16-at-17-29-51.jpg" 
         alt="Running Ninjas Logo" class="w-16 h-16 rounded-full" />
  </div>

  <!-- Main Card -->
  <div class="max-w-md mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Timing & Feedback</h2>

    <form id="feedbackForm">
      <!-- Marathon dropdown -->
      <label class="block mb-3">Select Marathon
        <select id="marathonName" name="marathonName" required class="w-full mt-1 p-2 border rounded"></select>
      </label>

      <!-- Unique ID -->
      <label class="block mb-2">Enter Unique ID
        <input id="uniqueId" name="uniqueId" type="text" required 
               class="w-full mt-1 p-2 border rounded" />
      </label>

      <button type="button" onclick="fetchRunnerDetails()" 
              class="w-full bg-indigo-600 text-white font-semibold py-2 rounded mb-4">
        Enter Timing & Give Feedback
      </button>

      <!-- Section for entering race timing + feedback -->
      <div id="runnerSection" class="hidden space-y-4">

        <!-- Auto-populated -->
        <div>
          <label class="block mb-1">Name</label>
          <input id="name" name="name" type="text" readonly 
                 class="w-full mt-1 p-2 border rounded bg-gray-100" />
        </div>

        <!-- Selectable category -->
        <div>
          <label class="block mb-1">Race Category</label>
          <select id="raceCategory" name="raceCategory" required 
                  class="w-full mt-1 p-2 border rounded">
            <option value="">-- Select Category --</option>
            <option>5K</option>
            <option>10K</option>
            <option>Half Marathon</option>
            <option>Full Marathon</option>
            <option>30K</option>
            <option>32K</option>
            <option>50K</option>
            <option>100K</option>
          </select>
        </div>

        <!-- Timing input -->
        <label class="block font-semibold text-gray-700">Enter your race timing</label>
        <div class="flex gap-2 items-center">
          <input type="number" id="hours" min="0" max="23" placeholder="HH" class="w-16 p-2 border rounded">
          :
          <input type="number" id="minutes" min="0" max="59" placeholder="MM" class="w-16 p-2 border rounded">
          :
          <input type="number" id="seconds" min="0" max="59" placeholder="SS" class="w-16 p-2 border rounded">
        </div>
        <input type="hidden" id="duration" name="duration">

        <!-- Feedback Sections -->
        <div class="mt-6">
          <h3 class="text-lg font-bold text-indigo-700 border-b pb-1">Pre-Race Feedback</h3>

          <label class="block mt-2">Registration Process</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="registrationProcess" value="1" required> 1</label>
            <label><input type="radio" name="registrationProcess" value="2"> 2</label>
            <label><input type="radio" name="registrationProcess" value="3"> 3</label>
            <label><input type="radio" name="registrationProcess" value="4"> 4</label>
            <label><input type="radio" name="registrationProcess" value="5"> 5</label>
          </div>

          <label class="block mt-3">Bib Distribution Organisation</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="bibDistribution" value="1" required> 1</label>
            <label><input type="radio" name="bibDistribution" value="2"> 2</label>
            <label><input type="radio" name="bibDistribution" value="3"> 3</label>
            <label><input type="radio" name="bibDistribution" value="4"> 4</label>
            <label><input type="radio" name="bibDistribution" value="5"> 5</label>
          </div>
        </div>

        <div class="mt-6">
          <h3 class="text-lg font-bold text-indigo-700 border-b pb-1">Race Feedback</h3>

          <label class="block mt-2">Holding Area Organisation</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="holdingArea" value="1" required> 1</label>
            <label><input type="radio" name="holdingArea" value="2"> 2</label>
            <label><input type="radio" name="holdingArea" value="3"> 3</label>
            <label><input type="radio" name="holdingArea" value="4"> 4</label>
            <label><input type="radio" name="holdingArea" value="5"> 5</label>
          </div>

          <label class="block mt-3">Route Difficulty</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="routeDifficulty" value="1" required> 1</label>
            <label><input type="radio" name="routeDifficulty" value="2"> 2</label>
            <label><input type="radio" name="routeDifficulty" value="3"> 3</label>
            <label><input type="radio" name="routeDifficulty" value="4"> 4</label>
            <label><input type="radio" name="routeDifficulty" value="5"> 5</label>
          </div>

          <label class="block mt-3">Route Support</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="routeSupport" value="1" required> 1</label>
            <label><input type="radio" name="routeSupport" value="2"> 2</label>
            <label><input type="radio" name="routeSupport" value="3"> 3</label>
            <label><input type="radio" name="routeSupport" value="4"> 4</label>
            <label><input type="radio" name="routeSupport" value="5"> 5</label>
          </div>

          <label class="block mt-3">T-shirt Quality</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="tshirtQuality" value="1" required> 1</label>
            <label><input type="radio" name="tshirtQuality" value="2"> 2</label>
            <label><input type="radio" name="tshirtQuality" value="3"> 3</label>
            <label><input type="radio" name="tshirtQuality" value="4"> 4</label>
            <label><input type="radio" name="tshirtQuality" value="5"> 5</label>
          </div>
        </div>

        <div class="mt-6">
          <h3 class="text-lg font-bold text-indigo-700 border-b pb-1">Post-Race Feedback</h3>

          <label class="block mt-2">Breakfast Quality</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="breakfastQuality" value="1" required> 1</label>
            <label><input type="radio" name="breakfastQuality" value="2"> 2</label>
            <label><input type="radio" name="breakfastQuality" value="3"> 3</label>
            <label><input type="radio" name="breakfastQuality" value="4"> 4</label>
            <label><input type="radio" name="breakfastQuality" value="5"> 5</label>
          </div>

          <label class="block mt-3">Medal Quality</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="medalQuality" value="1" required> 1</label>
            <label><input type="radio" name="medalQuality" value="2"> 2</label>
            <label><input type="radio" name="medalQuality" value="3"> 3</label>
            <label><input type="radio" name="medalQuality" value="4"> 4</label>
            <label><input type="radio" name="medalQuality" value="5"> 5</label>
          </div>
        </div>

        <div class="mt-6">
          <h3 class="text-lg font-bold text-indigo-700 border-b pb-1">Overall</h3>

          <label class="block mt-2">How likely to recommend this race to others?</label>
          <div class="flex items-center gap-3 mt-1 flex-wrap text-gray-700">
            <label><input type="radio" name="recommend" value="1" required> 1</label>
            <label><input type="radio" name="recommend" value="2"> 2</label>
            <label><input type="radio" name="recommend" value="3"> 3</label>
            <label><input type="radio" name="recommend" value="4"> 4</label>
            <label><input type="radio" name="recommend" value="5"> 5</label>
          </div>
        </div>

        <button id="submitBtn" type="submit" 
                class="w-full bg-green-600 text-white font-semibold py-2 rounded mt-4">
          Submit Timing & Feedback
        </button>
      </div>
    </form>

    <!-- Messages -->
    <p id="formMessage" class="text-green-600 mt-4 hidden"></p>
    <p id="errorMessage" class="text-red-600 mt-4 hidden"></p>

    <!-- Back Button -->
    <a href="index.html" class="back-link">&lt; Back</a>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxornu4mtZh0t6ZO0sZBytTL2PFqLexfpJN9thYAqcrCp_gkPGZUB-2jPt05fRCJrrZuw/exec';

    // Populate marathons where Feedback = TRUE
    window.onload = async function () {
      try {
        const res = await fetch(`${scriptURL}?listFeedbackMarathons=true`);
        const data = await res.json();
        const dropdown = document.getElementById("marathonName");
        if (data.marathons?.length) {
          data.marathons.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            dropdown.appendChild(opt);
          });
        }
      } catch (error) {
        alert("Error loading marathons: " + error.message);
      }
    };

    // Fetch runner details by Unique ID
    async function fetchRunnerDetails() {
      const uniqueId = document.getElementById("uniqueId").value.trim();
      const marathonName = document.getElementById("marathonName").value;
      if (!uniqueId || !marathonName) return alert("Please fill both fields.");

      try {
        const res = await fetch(`${scriptURL}?fetchRunnerDetails=true&uniqueId=${encodeURIComponent(uniqueId)}&marathonName=${encodeURIComponent(marathonName)}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById("runnerSection").classList.remove("hidden");
          document.getElementById("errorMessage").classList.add("hidden");
          document.getElementById("name").value = data.runner.name;
        } else {
          document.getElementById("runnerSection").classList.add("hidden");
          const errorMsg = document.getElementById("errorMessage");
          errorMsg.textContent = data.error || "Runner not found.";
          errorMsg.classList.remove("hidden");
        }
      } catch (error) {
        alert("Error fetching runner details: " + error.message);
      }
    }

    // Handle form submit
    document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Build duration
      const h = document.getElementById("hours").value || 0;
      const m = document.getElementById("minutes").value || 0;
      const s = document.getElementById("seconds").value || 0;
      document.getElementById("duration").value = 
        `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;

      const formData = new FormData(e.target);
      formData.append("saveFeedback", "true");

      try {
        const res = await fetch(scriptURL, { method: 'POST', body: formData });
        const text = await res.text();
        if (text.includes("Success")) {
          document.querySelectorAll("input, select, button").forEach(el => el.disabled = true);
          document.getElementById("formMessage").textContent = "✅ Feedback submitted successfully!";
          document.getElementById("formMessage").classList.remove("hidden");
          document.getElementById("errorMessage").classList.add("hidden");
          document.getElementById("submitBtn").classList.add("hidden");
        } else {
          alert("Error: " + text);
        }
      } catch (error) {
        alert("Submission failed: " + error.message);
      }
    });
  </script>
</body>
</html>
