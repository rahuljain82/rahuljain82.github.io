<head>
<meta charset="UTF-8" />

<title>Running Ninjas T-Shirt Order</title>

<body class="bg-gray-100 py-10">

<div class="w-full flex justify-center mb-6">
<img src="https://i.ibb.co/ZRLT8bH9/Whats-App-Image-2025-07-16-at-17-29-51.jpg"
class="w-16 h-16 rounded-full"/>
</div>

<div class="max-w-xl mx-auto bg-white rounded-xl shadow p-6">

<h2 class="text-xl font-semibold text-gray-800 mb-4">
Running Ninjas T-Shirt Order
</h2>

<form id="tshirtForm">

<label class="block mb-3">
Enter Unique ID
<input id="uniqueId" required class="w-full mt-1 p-2 border rounded"/>
</label>

<button type="button"
onclick="fetchRunnerData()"
class="w-full bg-indigo-600 text-white py-2 rounded mb-4">
Fetch My Data
</button>

  <div id="loadingSpinner" class="hidden text-center my-4">
  <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-indigo-500 border-opacity-60 mx-auto"></div>
  <p class="text-gray-500 text-sm mt-2">Fetching your details...</p>
</div>

<div id="runnerDetails" class="hidden">

  <label class="block mb-2">
Name
<input id="name" readonly
class="w-full mt-1 p-2 border rounded bg-gray-100 text-gray-600"/>
</label>

<label class="block mb-2">
Flat
<input id="flat" readonly
class="w-full mt-1 p-2 border rounded bg-gray-100 text-gray-600"/>
</label>

<label class="block mb-2">
Gender
<input id="gender" readonly
class="w-full mt-1 p-2 border rounded bg-gray-100 text-gray-600"/>
</label>

<label class="block mb-2">
T-Shirt Size
<select id="tshirtSize" required class="w-full mt-1 p-2 border rounded">

<option value="">Select Size</option>  
<option value="kids">Kids-S</option>
<option value="XS">XS</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
<option value="XXXL">XXXL</option>
</select>
</label>

<label class="block mb-3">
How Many T-Shirts Needed
<input id="tshirtQuantity" type="number" min="1" value="1"
class="w-full mt-1 p-2 border rounded"/>
</label>

<button type="submit"
class="w-full bg-green-600 text-white py-2 rounded">
Submit T-Shirt Request
</button>

  <div id="submitSpinner" class="hidden text-center my-4">
  <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-green-500 border-opacity-60 mx-auto"></div>
  <p class="text-gray-500 text-sm mt-2">Submitting your order...</p>
</div>

</div>

</form>

<p id="formMessage"
class="text-green-600 mt-4 hidden">
T-Shirt order submitted successfully!
</p>

</div>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbwdzbxxQXdYWhBQ9bybAtZjWc79WszuHSlzvT6zOWtZA-NmOIezLOEKTKXSji-DcU3O/exec";

async function fetchRunnerData(){

const uniqueId = document.getElementById("uniqueId").value.trim();
const spinner = document.getElementById("loadingSpinner");

if(!uniqueId){
alert("Please enter Unique ID");
return;
}

spinner.classList.remove("hidden");

try{

const res = await fetch(`${scriptURL}?uniqueId=${uniqueId}`);
const data = await res.json();

spinner.classList.add("hidden");

if(!data.success){
alert(data.error || "Runner not found");
return;
}

const r = data.runner;

document.getElementById("name").value = r.name;
document.getElementById("flat").value = r.flat;
document.getElementById("gender").value = r.gender;
document.getElementById("tshirtSize").value = r.tshirtSize;

document.getElementById("runnerDetails").classList.remove("hidden");

}catch(err){

spinner.classList.add("hidden");
alert("Error fetching runner data");

}finally {

spinner.classList.add("hidden");

}
}

  document.getElementById("tshirtForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const spinner = document.getElementById("submitSpinner");
spinner.classList.remove("hidden");

const formData = new FormData();

formData.append("uniqueId",document.getElementById("uniqueId").value);
formData.append("name",document.getElementById("name").value);
formData.append("flat",document.getElementById("flat").value);
formData.append("gender",document.getElementById("gender").value);
formData.append("tshirtSize",document.getElementById("tshirtSize").value);
formData.append("tshirtQuantity",document.getElementById("tshirtQuantity").value);

try{

const res = await fetch(scriptURL,{
method:"POST",
body:formData
});

const text = await res.text();

spinner.classList.add("hidden");

if(text.includes("Success")){

document.getElementById("formMessage").classList.remove("hidden");
document.getElementById("tshirtForm").reset();
document.getElementById("runnerDetails").classList.add("hidden");

}else{

alert("Error submitting form");

}

}catch(err){

spinner.classList.add("hidden");
alert("Submission failed");

}

});
