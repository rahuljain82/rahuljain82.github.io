<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Survey - Running Ninjas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: #f5f7fa; }

    .nav-bar-top { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background-color: #1f2937; color: white; }
    .nav-bar-bottom { display: flex; justify-content: center; background-color: #e5e7eb; padding: 0.5rem 1rem; gap: 1.5rem; font-weight: 500; flex-wrap: wrap; }
    .nav-bar-bottom a { color: #1f2937; text-decoration: none; font-size: 0.9rem; transition: color 0.15s; }
    .nav-bar-bottom a:hover { color: #6366f1; }

    .survey-card { background: white; border-radius: 1rem; padding: 1.75rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); border: 1px solid #e5e7eb; }
    .question-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
    .option-label { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.85rem; border-radius: 0.5rem; cursor: pointer; transition: background 0.12s; border: 2px solid transparent; }
    .option-label:hover { background: #ede9fe; }
    .option-label input[type="radio"] { width: 1.1rem; height: 1.1rem; accent-color: #6366f1; cursor: pointer; flex-shrink: 0; }
    .option-label.selected { background: #ede9fe; border-color: #6366f1; }

    /* Bar chart */
    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .bar-label { min-width: 140px; max-width: 200px; font-size: 0.8rem; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #e5e7eb; border-radius: 9999px; height: 1.4rem; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #818cf8); border-radius: 9999px; transition: width 0.6s ease; min-width: 2px; }
    .bar-count { min-width: 60px; font-size: 0.78rem; color: #6b7280; text-align: right; }

    .submit-btn { background: #6366f1; color: white; font-weight: 700; border: none; border-radius: 0.6rem; padding: 0.75rem 2.5rem; font-size: 1rem; cursor: pointer; transition: background 0.15s; }
    .submit-btn:hover { background: #4f46e5; }
    .submit-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .spinner { border: 3px solid #e5e7eb; border-top-color: #6366f1; border-radius: 50%; width: 2rem; height: 2rem; animation: spin 0.7s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div style="display:flex; justify-content:center; align-items:center; padding:1.2rem 1rem 0.5rem; background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);">
    <div style="background:linear-gradient(135deg,#e0e7ff 0%,#c7d2fe 100%); border-radius:50%; padding:1rem; width:80px; height:80px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 24px rgba(102,126,234,0.10);">
      <img src="https://i.ibb.co/jvwQ4Zm/running-ninja-logo.png" alt="Running Ninjas" style="width:52px;height:52px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'; this.parentNode.innerHTML='🏃';" />
    </div>
  </div>
  <nav class="nav-bar-top">
    <span style="font-weight:700; font-size:1.1rem;">Running Ninjas</span>
    <a href="landing.html" style="color:#d1d5db; font-size:0.85rem; text-decoration:none;">← Back to Home</a>
  </nav>
  <div class="nav-bar-bottom">
    <a href="landing.html">Home</a>
    <a href="index.html">Marathons</a>
    <a href="survey.html" style="color:#6366f1; font-weight:700;">Survey</a>
    <a href="quiz.html">Quiz</a>
    <a href="manage-profiles.html">Join Us</a>
  </div>

  <!-- Main -->
  <main style="max-width:720px; margin:0 auto; padding:2rem 1rem 4rem;">
    <div style="margin-bottom:1.75rem;">
      <h1 style="font-size:1.8rem; font-weight:800; color:#1e293b; margin:0 0 0.25rem;">Community Surveys</h1>
      <p style="color:#64748b; font-size:0.95rem; margin:0;">Share your thoughts — your vote is anonymous.</p>
    </div>

    <div id="content">
      <div class="spinner"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Anonymous session ID for dedup — persisted in localStorage
    function getSessionId() {
      let sid = localStorage.getItem('rn_session_id');
      if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('rn_session_id', sid); }
      return sid;
    }
    const SESSION_ID = getSessionId();

    function alreadySubmitted(surveyId) {
      return localStorage.getItem('rn_survey_done_' + surveyId) === '1';
    }
    function markSubmitted(surveyId) {
      localStorage.setItem('rn_survey_done_' + surveyId, '1');
    }

    async function loadSurveys() {
      const content = document.getElementById('content');
      try {
        const { data: surveys, error } = await db.from('surveys').select('*').eq('active', true).order('created_at', { ascending: false });
        if (error) throw error;
        if (!surveys || surveys.length === 0) {
          content.innerHTML = `<div class="survey-card" style="text-align:center; color:#94a3b8; padding:3rem;">
            <div style="font-size:3rem; margin-bottom:1rem;">📋</div>
            <p style="font-size:1.1rem; font-weight:600;">No active surveys right now</p>
            <p style="font-size:0.9rem; margin-top:0.5rem;">Check back later for new community surveys!</p>
          </div>`;
          return;
        }
        content.innerHTML = '';
        for (const survey of surveys) {
          const el = document.createElement('div');
          el.id = 'survey-' + survey.id;
          content.appendChild(el);
          if (alreadySubmitted(survey.id)) {
            await renderResults(survey, el);
          } else {
            await renderSurveyForm(survey, el);
          }
        }
      } catch (e) {
        content.innerHTML = `<div class="survey-card" style="color:#ef4444;">Failed to load surveys: ${e.message}</div>`;
      }
    }

    async function renderSurveyForm(survey, container) {
      const { data: questions } = await db.from('survey_questions').select('*, survey_options(*)').eq('survey_id', survey.id).order('display_order');
      if (!questions || questions.length === 0) return; // skip surveys with no questions

      // Sort options by display_order
      questions.forEach(q => { if (q.survey_options) q.survey_options.sort((a, b) => a.display_order - b.display_order); });

      container.innerHTML = `
        <div class="survey-card">
          <h2 style="font-size:1.3rem; font-weight:700; color:#1e293b; margin:0 0 0.4rem;">${esc(survey.title)}</h2>
          ${survey.description ? `<p style="color:#64748b; font-size:0.9rem; margin:0 0 1.5rem;">${esc(survey.description)}</p>` : '<div style="margin-bottom:1.5rem;"></div>'}
          <form id="form-${survey.id}" onsubmit="submitSurvey(event, '${survey.id}')">
            ${questions.map(q => `
              <div class="question-block" id="qblock-${q.id}">
                <p style="font-weight:600; color:#1e293b; margin:0 0 0.85rem; font-size:0.97rem;">${esc(q.question_text)}</p>
                ${q.survey_options.map(o => `
                  <label class="option-label" onclick="selectOption(this)">
                    <input type="radio" name="q-${q.id}" value="${o.id}" required />
                    <span style="font-size:0.9rem;">${esc(o.option_text)}</span>
                  </label>
                `).join('')}
              </div>
            `).join('')}
            <p id="form-error-${survey.id}" style="color:#ef4444; font-size:0.85rem; margin:0.5rem 0 0; display:none;"></p>
            <div style="margin-top:1.5rem;">
              <button type="submit" class="submit-btn" id="submit-btn-${survey.id}">Submit Survey</button>
            </div>
          </form>
        </div>`;
    }

    function selectOption(label) {
      const name = label.querySelector('input[type="radio"]').name;
      document.querySelectorAll(`[name="${name}"]`).forEach(r => r.closest('.option-label').classList.remove('selected'));
      label.classList.add('selected');
    }

    async function submitSurvey(event, surveyId) {
      event.preventDefault();
      const errEl = document.getElementById('form-error-' + surveyId);
      const btn = document.getElementById('submit-btn-' + surveyId);
      const form = document.getElementById('form-' + surveyId);
      errEl.style.display = 'none';

      // Collect answers
      const formData = new FormData(form);
      const responses = [];
      for (const [key, optionId] of formData.entries()) {
        const questionId = key.replace('q-', '');
        responses.push({ survey_id: surveyId, question_id: questionId, option_id: optionId, session_id: SESSION_ID });
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';

      const { error } = await db.from('survey_responses').insert(responses);
      if (error) {
        errEl.textContent = 'Submission failed: ' + error.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Survey';
        return;
      }

      markSubmitted(surveyId);
      const container = document.getElementById('survey-' + surveyId);
      const surveyData = { id: surveyId, title: form.closest('.survey-card').querySelector('h2').textContent, description: '' };
      await renderResults({ id: surveyId, title: surveyData.title }, container, true);
    }

    async function renderResults(survey, container, showThankYou = false) {
      const { data: questions } = await db.from('survey_questions').select('*, survey_options(*)').eq('survey_id', survey.id).order('display_order');
      if (!questions || questions.length === 0) return;

      questions.forEach(q => { if (q.survey_options) q.survey_options.sort((a, b) => a.display_order - b.display_order); });

      // Fetch all responses for this survey
      const { data: responses } = await db.from('survey_responses').select('question_id, option_id').eq('survey_id', survey.id);

      // Count votes per option
      const voteCounts = {};
      (responses || []).forEach(r => {
        if (!voteCounts[r.question_id]) voteCounts[r.question_id] = {};
        voteCounts[r.question_id][r.option_id] = (voteCounts[r.question_id][r.option_id] || 0) + 1;
      });

      const resultsHtml = questions.map(q => {
        const qVotes = voteCounts[q.id] || {};
        const totalVotes = q.survey_options.reduce((sum, o) => sum + (qVotes[o.id] || 0), 0);
        return `
          <div class="question-block" style="background:#f0fdf4; border-color:#bbf7d0;">
            <p style="font-weight:600; color:#1e293b; margin:0 0 1rem; font-size:0.97rem;">${esc(q.question_text)}</p>
            ${q.survey_options.map(o => {
              const votes = qVotes[o.id] || 0;
              const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
              return `
                <div class="bar-row">
                  <div class="bar-label" title="${esc(o.option_text)}">${esc(o.option_text)}</div>
                  <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
                  <div class="bar-count">${votes} (${pct}%)</div>
                </div>`;
            }).join('')}
            <p style="font-size:0.75rem; color:#94a3b8; margin:0.75rem 0 0;">${totalVotes} vote${totalVotes !== 1 ? 's' : ''} total</p>
          </div>`;
      }).join('');

      container.innerHTML = `
        <div class="survey-card">
          ${showThankYou ? `
            <div style="display:flex; align-items:center; gap:0.75rem; background:#f0fdf4; border:1px solid #86efac; border-radius:0.6rem; padding:0.85rem 1rem; margin-bottom:1.5rem;">
              <span style="font-size:1.4rem;">✅</span>
              <div>
                <p style="font-weight:700; color:#166534; margin:0; font-size:0.95rem;">Thanks for participating!</p>
                <p style="color:#15803d; font-size:0.82rem; margin:0.2rem 0 0;">Your response has been recorded. Here are the live results:</p>
              </div>
            </div>` : `
            <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.25rem; color:#6b7280; font-size:0.82rem;">
              <span>📊</span> You've already submitted this survey. Here are the live results:
            </div>`}
          <h2 style="font-size:1.3rem; font-weight:700; color:#1e293b; margin:0 0 1.5rem;">${esc(survey.title)}</h2>
          ${resultsHtml}
        </div>`;
    }

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    loadSurveys();
  </script>
</body>
</html>
