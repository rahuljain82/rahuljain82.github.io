<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bib Collection - Running Ninjas</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9WH7YSXZ94"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9WH7YSXZ94');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 py-10">
  <div class="w-full flex justify-center mb-6">
    <img src="https://i.ibb.co/ZRLT8bH9/Whats-App-Image-2025-07-16-at-17-29-51.jpg" alt="Running Ninjas Logo" class="w-16 h-16 rounded-full" />
  </div>

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Marathon Bib Collection</h2>

    <form id="bibForm">
      <label class="block mb-3">Select Marathon
        <select id="marathonName" required class="w-full mt-1 p-2 border rounded">
          <option value="">Loading events...</option>
        </select>
      </label>

      <label class="block mb-3">
        <span class="flex items-center gap-1">Enter Unique ID
          <button type="button" onclick="document.getElementById('uniqueIdInfo').classList.toggle('hidden')" class="w-4 h-4 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold leading-none flex items-center justify-center hover:bg-indigo-200" title="What is my Unique ID?">i</button>
        </span>
        <div id="uniqueIdInfo" class="hidden mt-1 mb-2 text-xs text-gray-600 bg-indigo-50 border border-indigo-100 rounded p-2 leading-relaxed">
          Your Unique ID is the first 4 letters of your first name in capitals, followed by your flat number.<br/>
          <span class="font-medium">Example:</span> John Doe living in flat B204 → <span class="font-mono font-semibold text-indigo-700">JOHNB204</span>
        </div>
        <input id="uniqueId" type="text" required class="w-full mt-1 p-2 border rounded" />
      </label>

      <button type="button" onclick="fetchRunnerData()" class="w-full bg-indigo-600 text-white py-2 rounded mb-4">Fetch My Data</button>

      <!-- Profile picker (shown only when secondary profiles exist) -->
      <div id="profilePickerSection" class="hidden mb-4 p-3 bg-indigo-50 border border-indigo-100 rounded-lg">
        <label class="block text-sm font-medium text-gray-700 mb-1">Who is this registration for?</label>
        <select id="profileSelect" class="w-full p-2 border rounded text-sm" onchange="onProfileSelect()">
        </select>
      </div>

      <div id="runnerDetails" class="hidden">
        <label class="block mb-2">Name <input id="name" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Gender <input id="gender" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Date of Birth <input id="dob" type="date" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Blood Group <input id="bloodGroup" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Emergency Contact Name <input id="emergencyName" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Emergency Contact Number <input id="emergencyNumber" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">T-Shirt Size <input id="tshirtSize" type="text" class="w-full mt-1 p-2 border rounded" /></label>

        <label class="block mb-2">Select Distance
          <select id="distance" required class="w-full mt-1 p-2 border rounded">
            <option value="">-- Select Distance --</option>
          </select>
        </label>

        <label class="block mb-2">Enter Bib Number <input id="bibNumber" type="text" required class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Email Proof <textarea id="comments" class="w-full mt-1 p-2 border rounded"></textarea></label>

        <div id="existingBibNotice" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded p-3 mb-3">
          ⚠️ An existing bib registration for this race was found and pre-filled above.
        </div>

        <p id="submitError" class="hidden text-red-600 text-sm mb-2"></p>
        <button id="bibSubmitBtn" type="submit" class="w-full bg-green-600 text-white py-2 rounded">Submit for Bib Collection</button>
      </div>
    </form>

    <p id="formMessage" class="text-green-600 mt-4 hidden">Bib collection submitted successfully!</p>
  </div>

  <!-- Bus Interest Prompt -->
  <div id="busPromptModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-sm w-full text-center">
      <p class="text-lg font-semibold text-gray-800 mb-2">Interested in Bus?</p>
      <p class="text-sm text-gray-500 mb-5">Bus registration is open for this race. Would you like to register now?</p>
      <div class="flex gap-3 justify-center">
        <button id="busPromptNo" class="px-5 py-2 rounded border border-gray-300 text-gray-700 text-sm hover:bg-gray-50">No thanks</button>
        <button id="busPromptYes" class="px-5 py-2 rounded bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">Yes, register</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async function() {
      const { data, error } = await db
        .from('events')
        .select('event_name')
        .eq('bib_details', true)
        .order('event_date', { ascending: true });

      const dropdown = document.getElementById('marathonName');
      dropdown.innerHTML = '';

      if (error || !data || data.length === 0) {
        const opt = document.createElement('option');
        opt.value = ''; opt.textContent = 'No bib collection events available';
        dropdown.appendChild(opt);
        return;
      }

      data.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.event_name; opt.textContent = e.event_name;
        dropdown.appendChild(opt);
      });
    };

    const RACE_CAT_LABELS = { '5K':'5K', '10K':'10K', '21K':'21K (Half Marathon)', '42K':'42K (Full Marathon)', '50K':'50K (Ultra)', '70K':'70K (Ultra)', '100K':'100K (Ultra)' };

    let primaryRunner = null;
    let secondaryProfiles = [];
    let selectedProfileId = '';

    async function fetchRunnerData() {
      const uniqueId = document.getElementById('uniqueId').value.trim().toUpperCase();
      const marathonName = document.getElementById('marathonName').value;
      if (!uniqueId || !marathonName) return alert('Please enter both fields.');

      const { data: runner, error } = await db
        .from('runners')
        .select('first_name, last_name, gender, dob, blood_group, emergency_contact_name, emergency_contact_number, tshirt_size, status')
        .eq('unique_id', uniqueId)
        .maybeSingle();

      if (error || !runner) { alert('Runner not found.'); return; }
      if (runner.status !== 'approved') {
        alert('Your profile is pending admin approval. You will be able to register once approved.');
        return;
      }
      primaryRunner = runner;

      // Load approved secondary profiles
      const { data: profiles } = await db
        .from('secondary_profiles')
        .select('*')
        .eq('runner_unique_id', uniqueId)
        .eq('status', 'approved');
      secondaryProfiles = profiles || [];

      document.getElementById('uniqueId').setAttribute('readonly', true);
      document.getElementById('uniqueId').classList.add('bg-gray-100', 'text-gray-500');
      document.getElementById('marathonName').setAttribute('disabled', true);

      // Build profile picker
      if (secondaryProfiles.length > 0) {
        const sel = document.getElementById('profileSelect');
        sel.innerHTML = `<option value="">Myself (${runner.first_name} ${runner.last_name || ''})</option>`;
        secondaryProfiles.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.profile_id;
          opt.textContent = `${p.profile_type === 'kid' ? 'Kid' : 'Guest'}: ${p.full_name} (${p.profile_id})`;
          sel.appendChild(opt);
        });
        document.getElementById('profilePickerSection').classList.remove('hidden');
      }

      selectedProfileId = '';
      await loadBibForProfile(uniqueId, marathonName, runner, null);
    }

    async function onProfileSelect() {
      const uniqueId = document.getElementById('uniqueId').value.trim();
      const marathonName = document.getElementById('marathonName').value;
      const pid = document.getElementById('profileSelect').value;
      selectedProfileId = pid;
      const profile = pid ? secondaryProfiles.find(p => p.profile_id === pid) : null;
      await loadBibForProfile(uniqueId, marathonName, primaryRunner, profile);
    }

    async function loadBibForProfile(uniqueId, marathonName, runner, profile) {
      document.getElementById('name').value = profile
        ? profile.full_name
        : (runner.first_name + ' ' + (runner.last_name || '')).trim();
      document.getElementById('gender').value = runner.gender || '';
      document.getElementById('dob').value = profile?.dob || runner.dob || '';
      document.getElementById('bloodGroup').value = runner.blood_group || '';
      document.getElementById('emergencyName').value = runner.emergency_contact_name || '';
      document.getElementById('emergencyNumber').value = runner.emergency_contact_number || '';
      document.getElementById('tshirtSize').value = profile?.tshirt_size || runner.tshirt_size || '';

      const { data: eventData } = await db
        .from('event_race_categories')
        .select('race_categories')
        .eq('event_name', marathonName)
        .maybeSingle();
      const cats = eventData?.race_categories || [];
      const distSel = document.getElementById('distance');
      distSel.innerHTML = '<option value="">-- Select Distance --</option>';
      cats.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = RACE_CAT_LABELS[c] || c; distSel.appendChild(opt); });

      const profileId = profile ? profile.profile_id : '';
      const { data: existingBib } = await db
        .from('bib_details')
        .select('distance, bib_number, email_proof')
        .eq('unique_id', uniqueId)
        .eq('event_name', marathonName)
        .eq('profile_id', profileId)
        .maybeSingle();

      const notice = document.getElementById('existingBibNotice');
      if (existingBib) {
        document.getElementById('distance').value = existingBib.distance || '';
        document.getElementById('bibNumber').value = existingBib.bib_number || '';
        document.getElementById('comments').value = existingBib.email_proof || '';
        notice.classList.remove('hidden');
        document.getElementById('bibSubmitBtn').textContent = 'Update Bib Details';
      } else {
        distSel.selectedIndex = 0;
        document.getElementById('bibNumber').value = '';
        document.getElementById('comments').value = '';
        notice.classList.add('hidden');
        document.getElementById('bibSubmitBtn').textContent = 'Submit for Bib Collection';
      }

      document.getElementById('runnerDetails').classList.remove('hidden');
    }

    document.getElementById('bibForm').addEventListener('submit', async e => {
      e.preventDefault();

      const uniqueId   = document.getElementById('uniqueId').value.trim();
      const eventName  = document.getElementById('marathonName').value;
      const distance   = document.getElementById('distance').value;
      const bibNumber  = document.getElementById('bibNumber').value.trim();
      const errEl      = document.getElementById('submitError');

      if (!uniqueId || !eventName) {
        errEl.textContent = 'Missing event or Unique ID. Please refresh and start again.';
        errEl.classList.remove('hidden'); return;
      }
      if (!distance) {
        errEl.textContent = 'Please select a distance.';
        errEl.classList.remove('hidden'); return;
      }
      if (!bibNumber) {
        errEl.textContent = 'Please enter your Bib Number.';
        errEl.classList.remove('hidden'); return;
      }
      errEl.classList.add('hidden');

      const { error } = await db.from('bib_details').upsert([{
        unique_id:        uniqueId,
        event_name:       eventName,
        profile_id:       selectedProfileId,
        name:             document.getElementById('name').value,
        gender:           document.getElementById('gender').value,
        dob:              document.getElementById('dob').value || null,
        blood_group:      document.getElementById('bloodGroup').value,
        emergency_name:   document.getElementById('emergencyName').value,
        emergency_number: document.getElementById('emergencyNumber').value,
        tshirt_size:      document.getElementById('tshirtSize').value,
        distance:         distance,
        bib_number:       bibNumber,
        email_proof:      document.getElementById('comments').value,
      }], { onConflict: 'unique_id,event_name,profile_id' });

      if (error) {
        document.getElementById('submitError').textContent = 'Something went wrong. Please check your details and try again.';
        document.getElementById('submitError').classList.remove('hidden');
        return;
      }

      const submittedUniqueId = document.getElementById('uniqueId').value.trim();
      const submittedEvent = document.getElementById('marathonName').value;

      document.getElementById('formMessage').classList.remove('hidden');
      document.getElementById('bibForm').reset();
      document.getElementById('runnerDetails').classList.add('hidden');
      document.getElementById('bibSubmitBtn').textContent = 'Submit for Bib Collection';
      document.getElementById('submitError').classList.add('hidden');
      document.getElementById('uniqueId').removeAttribute('readonly');
      document.getElementById('uniqueId').classList.remove('bg-gray-100', 'text-gray-500');
      document.getElementById('marathonName').removeAttribute('disabled');

      const { data: eventInfo } = await db
        .from('events')
        .select('bus_available')
        .eq('event_name', submittedEvent)
        .maybeSingle();

      if (eventInfo?.bus_available) {
        document.getElementById('busPromptModal').classList.remove('hidden');
        document.getElementById('busPromptYes').onclick = () => {
          window.location.href = 'RNBusForm.html?uniqueId=' + encodeURIComponent(submittedUniqueId) + '&event=' + encodeURIComponent(submittedEvent);
        };
        document.getElementById('busPromptNo').onclick = () => {
          document.getElementById('busPromptModal').classList.add('hidden');
        };
      }
    });
  </script>
</body>
</html>
