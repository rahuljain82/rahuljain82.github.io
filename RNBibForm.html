<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bib Collection - Running Ninjas</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9WH7YSXZ94"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9WH7YSXZ94');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 py-10">
  <div class="w-full flex justify-center mb-6">
    <img src="https://i.ibb.co/ZRLT8bH9/Whats-App-Image-2025-07-16-at-17-29-51.jpg" alt="Running Ninjas Logo" class="w-16 h-16 rounded-full" />
  </div>

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Marathon Bib Collection</h2>

    <form id="bibForm">
      <label class="block mb-3">Select Marathon
        <select id="marathonName" required class="w-full mt-1 p-2 border rounded">
          <option value="">Loading events...</option>
        </select>
      </label>

      <label class="block mb-3">Enter Unique ID
        <input id="uniqueId" type="text" required class="w-full mt-1 p-2 border rounded" />
      </label>

      <button type="button" onclick="fetchRunnerData()" class="w-full bg-indigo-600 text-white py-2 rounded mb-4">Fetch My Data</button>

      <div id="runnerDetails" class="hidden">
        <label class="block mb-2">Name <input id="name" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Gender <input id="gender" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Date of Birth <input id="dob" type="date" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Blood Group <input id="bloodGroup" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Emergency Contact Name <input id="emergencyName" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Emergency Contact Number <input id="emergencyNumber" type="text" class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">T-Shirt Size <input id="tshirtSize" type="text" class="w-full mt-1 p-2 border rounded" /></label>

        <label class="block mb-2">Select Distance
          <select id="distance" required class="w-full mt-1 p-2 border rounded">
            <option value="">-- Select Distance --</option>
          </select>
        </label>

        <label class="block mb-2">Enter Bib Number <input id="bibNumber" type="text" required class="w-full mt-1 p-2 border rounded" /></label>
        <label class="block mb-2">Email Proof <textarea id="comments" class="w-full mt-1 p-2 border rounded"></textarea></label>

        <div id="existingBibNotice" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 text-sm rounded p-3 mb-3">
          ⚠️ An existing bib registration for this race was found and pre-filled above.
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Submit for Bib Collection</button>
      </div>
    </form>

    <p id="formMessage" class="text-green-600 mt-4 hidden">Bib collection submitted successfully!</p>
  </div>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async function() {
      const { data, error } = await db
        .from('events')
        .select('event_name')
        .eq('bib_details', true)
        .order('event_date', { ascending: true });

      const dropdown = document.getElementById('marathonName');
      dropdown.innerHTML = '';

      if (error || !data || data.length === 0) {
        const opt = document.createElement('option');
        opt.value = ''; opt.textContent = 'No bib collection events available';
        dropdown.appendChild(opt);
        return;
      }

      data.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.event_name; opt.textContent = e.event_name;
        dropdown.appendChild(opt);
      });
    };

    const RACE_CAT_LABELS = { '5K':'5K', '10K':'10K', '21K':'21K (Half Marathon)', '42K':'42K (Full Marathon)', '50K':'50K (Ultra)', '70K':'70K (Ultra)', '100K':'100K (Ultra)' };

    async function fetchRunnerData() {
      const uniqueId = document.getElementById('uniqueId').value.trim();
      const marathonName = document.getElementById('marathonName').value;
      if (!uniqueId || !marathonName) return alert('Please enter both fields.');

      const { data: runner, error } = await db
        .from('runners')
        .select('first_name, last_name, gender, dob, blood_group, emergency_contact_name, emergency_contact_number, tshirt_size')
        .eq('unique_id', uniqueId)
        .single();

      if (error || !runner) { alert('Runner not found.'); return; }

      document.getElementById('name').value = runner.first_name + ' ' + (runner.last_name || '');
      document.getElementById('gender').value = runner.gender || '';
      document.getElementById('dob').value = runner.dob || '';
      document.getElementById('bloodGroup').value = runner.blood_group || '';
      document.getElementById('emergencyName').value = runner.emergency_contact_name || '';
      document.getElementById('emergencyNumber').value = runner.emergency_contact_number || '';
      document.getElementById('tshirtSize').value = runner.tshirt_size || '';

      const { data: eventData, error: catError } = await db
        .from('event_race_categories')
        .select('race_categories')
        .eq('event_name', marathonName)
        .maybeSingle();
      if (catError) console.error('event_race_categories error:', catError.message);
      const cats = eventData?.race_categories || [];
      const distSel = document.getElementById('distance');
      distSel.innerHTML = '<option value="">-- Select Distance --</option>';
      cats.forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = RACE_CAT_LABELS[c] || c; distSel.appendChild(opt); });

      const { data: existingBib } = await db
        .from('bib_details')
        .select('distance, bib_number, email_proof')
        .eq('unique_id', uniqueId)
        .eq('event_name', marathonName)
        .maybeSingle();

      const notice = document.getElementById('existingBibNotice');
      if (existingBib) {
        document.getElementById('distance').value = existingBib.distance || '';
        document.getElementById('bibNumber').value = existingBib.bib_number || '';
        document.getElementById('comments').value = existingBib.email_proof || '';
        notice.classList.remove('hidden');
      } else {
        notice.classList.add('hidden');
      }

      document.getElementById('runnerDetails').classList.remove('hidden');
    }

    document.getElementById('bibForm').addEventListener('submit', async e => {
      e.preventDefault();

      const { error } = await db.from('bib_details').insert([{
        unique_id:        document.getElementById('uniqueId').value.trim(),
        event_name:       document.getElementById('marathonName').value,
        name:             document.getElementById('name').value,
        gender:           document.getElementById('gender').value,
        dob:              document.getElementById('dob').value || null,
        blood_group:      document.getElementById('bloodGroup').value,
        emergency_name:   document.getElementById('emergencyName').value,
        emergency_number: document.getElementById('emergencyNumber').value,
        tshirt_size:      document.getElementById('tshirtSize').value,
        distance:         document.getElementById('distance').value,
        bib_number:       document.getElementById('bibNumber').value,
        email_proof:      document.getElementById('comments').value,
      }]);

      if (error) { alert('Error: ' + error.message); return; }

      document.getElementById('formMessage').classList.remove('hidden');
      document.getElementById('bibForm').reset();
      document.getElementById('runnerDetails').classList.add('hidden');
    });
  </script>
</body>
</html>
